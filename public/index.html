<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OASIS: Última Esperança</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="stars"></div>
  <div class="gradient-orb orb1"></div>
  <div class="gradient-orb orb2"></div>

  <header class="main-header">
    <h1 class="titulo-jogo">
      <span class="titulo-oasis">OASIS</span>
      <span class="titulo-sub">ÚLTIMA ESPERANÇA</span>
    </h1>
  </header>

  <main>
    <!-- TELA 1: LOGIN / CADASTRO -->
    <section id="telaLogin" class="tela ativa">
      <div class="card-entrada">
        <h2>Acesso ao OASIS</h2>
        <p class="lore">Faça login ou crie sua conta para entrar na arena.</p>
        
        <div class="campo">
          <label>Usuário (Nome)</label>
          <input type="text" id="inputUsuario" placeholder="Seu nome de jogador..." maxlength="15" />
        </div>
        <div class="campo">
          <label>Senha</label>
          <input type="password" id="inputSenha" placeholder="Sua senha secreta..." maxlength="20" />
        </div>
        
        <button id="btnLogin" class="btn-glow" style="margin-bottom: 10px;">▶ Entrar na Conta</button>
        <button id="btnCadastrar" class="btn-secundario" style="width: 100%;">Criar Nova Conta</button>
        
        <div id="avisoLogin" class="aviso escondido" style="margin-top: 15px;"></div>
      </div>
    </section>

    <!-- TELA 2: ESCOLHA DE AVATAR -->
    <section id="telaAvatar" class="tela escondido">
      <div class="card-entrada">
        <h2>Escolha seu Avatar</h2>
        <p class="lore" id="boasVindasNome">Bem-vindo ao OASIS!</p>
        
        <div class="campo">
          <div id="gridAvatares" class="grid-avatares"></div>
        </div>
        
        <button id="btnEntrarSala" class="btn-glow">▶ Entrar na Sala</button>
      </div>
    </section>

    <!-- TELA 3: JOGO -->
    <section id="telaJogo" class="tela escondido">
      <div class="barra-energia-container">
        <div class="energia-label">
          <span>⚡ ENERGIA DO SERVIDOR</span>
          <span id="energiaValor" class="energia-valor">100%</span>
        </div>
        <div class="barra-energia">
          <div id="energiaFill" class="energia-fill"></div>
        </div>
      </div>

      <div class="layout-jogo">
        <aside class="painel-placar">
          <h3>🏆 PLACAR</h3>
          <ul id="listaJogadores" class="lista-jogadores"></ul>
        </aside>

        <div class="painel-central">
          <div id="areaLobby" class="area-lobby">
            <div class="lobby-icon">🌌</div>
            <h2>Aguardando o início...</h2>
            <p id="lobbyInfo">Jogadores: <strong>0 / 5</strong></p>
            <button id="btnIniciar" class="btn-glow">▶ Iniciar Jogo</button>
          </div>

          <div id="areaDesafio" class="area-desafio escondido">
            <p id="desafioPergunta" class="desafio-pergunta"></p>
            <div id="opcoesDesafio" class="opcoes"></div>
            <p id="mensagemRodada" class="mensagem-rodada"></p>
          </div>
        </div>

        <aside class="painel-chat">
          <h3>💬 CHAT</h3>
          <div id="chatMensagens" class="chat-mensagens"></div>
          <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Mensagem..." maxlength="100" />
            <button id="btnEnviarChat">➤</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="modalFim" class="modal escondido">
    <div class="modal-content">
      <div class="modal-emoji">🏆</div>
      <h2 id="modalTitulo">FIM DE JOGO</h2>
      <p id="modalMensagem"></p>
    </div>
  </div>

  <div id="toast" class="toast escondido"></div>
  <script src="script.js"></script>
</body>
</html>
